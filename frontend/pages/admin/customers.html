<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Management - ShopEase Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/admin.css" rel="stylesheet" />
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="admin-sidebar" id="adminSidebar">
  <a href="/pages/customer/dashboard/" class="sidebar-brand"><div class="sidebar-brand-icon"><i class="bi bi-bag-heart-fill"></i></div><div class="sidebar-brand-text">Shop<span>Ease</span><span class="sidebar-brand-sub">Admin Panel</span></div></a>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-item"><a href="/pages/customer/dashboard/" class="sidebar-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/products/" class="sidebar-nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/customer/orders/" class="sidebar-nav-link"><i class="bi bi-bag-check"></i><span>Orders</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/reports/" class="sidebar-nav-link"><i class="bi bi-graph-up-arrow"></i><span>Reports</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/customers/" class="sidebar-nav-link active"><i class="bi bi-people"></i><span>Customers</span></a></div>
    <div class="sidebar-nav-item"><a href="#" class="sidebar-nav-link" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></div>
  </nav>
</aside>
<div class="admin-main">
  <div class="admin-topbar">
    <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <div class="topbar-breadcrumb">Users / <strong>Customers</strong></div>
    <div class="topbar-actions"><div class="topbar-user"><div class="topbar-user-avatar">A</div></div></div>
  </div>
  <div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div><h4 class="fw-800 mb-0" style="color:#0d2b55">Customer Management</h4><p class="text-muted mb-0" style="font-size:0.85rem">View and manage customer accounts</p></div>
      <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>Export</button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-header"><div class="stat-label">Total Customers</div><div class="stat-icon" style="background:#e8f0fe;color:#0d2b55"><i class="bi bi-people"></i></div></div><div class="stat-value">1,240</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-header"><div class="stat-label">Active</div><div class="stat-icon" style="background:#d4edda;color:#155724"><i class="bi bi-person-check"></i></div></div><div class="stat-value">1,165</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-header"><div class="stat-label">New This Month</div><div class="stat-icon" style="background:#fff3cd;color:#664d03"><i class="bi bi-person-plus"></i></div></div><div class="stat-value">87</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-card-header"><div class="stat-label">Avg. Spend</div><div class="stat-icon" style="background:#f8d7da;color:#721c24"><i class="bi bi-currency-exchange"></i></div></div><div class="stat-value">₱32K</div></div></div>
    </div>

    <div class="admin-table-card">
      <div class="admin-table-header">
        <div class="admin-table-title">All Customers</div>
        <input type="text" class="form-control form-control-sm table-search" data-table="customersTable" placeholder="Search customers..." style="width:220px">
      </div>
      <div class="table-responsive">
        <table class="table admin-table" id="customersTable">
          <thead><tr><th>#</th><th>Customer</th><th>Email</th><th>Joined</th><th>Orders</th><th>Total Spent</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="customersTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const colors = ['#0d2b55','#1a6fc4','#28a745','#f0a500','#dc3545','#6c757d'];
  document.getElementById('customersTbody').innerHTML = SAMPLE_CUSTOMERS.map((c, i) => `
    <tr>
      <td class="text-muted" style="font-size:0.8rem">${String(c.id).padStart(5,'0')}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <div style="width:36px;height:36px;border-radius:50%;background:${colors[i%colors.length]};color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0">${c.name[0]}</div>
          <div class="fw-600" style="font-size:0.88rem">${c.name}</div>
        </div>
      </td>
      <td style="font-size:0.85rem">${c.email}</td>
      <td style="font-size:0.85rem">${formatDate(c.joined)}</td>
      <td class="fw-600">${c.orders}</td>
      <td class="fw-600">${formatPrice(c.spent)}</td>
      <td><span class="status-badge ${c.status==='Active'?'status-active':'status-inactive'}">${c.status}</span></td>
      <td>
        <div class="d-flex gap-1">
          <button class="btn btn-xs btn-outline-secondary" style="font-size:0.75rem;padding:0.2rem 0.6rem" onclick="showToast('Viewing ${c.name}\\'s profile','info')"><i class="bi bi-eye"></i></button>
          <button class="btn btn-xs btn-outline-secondary" style="font-size:0.75rem;padding:0.2rem 0.6rem" onclick="showToast('Order history for ${c.name}','info')"><i class="bi bi-bag"></i></button>
        </div>
      </td>
    </tr>`).join('');
});
</script>
</body>
</html>
