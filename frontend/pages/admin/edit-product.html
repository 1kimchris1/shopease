<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="theme-color" content="#0d2b55" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Edit Product - ShopEase Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/admin.css" rel="stylesheet" />
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="admin-sidebar" id="adminSidebar">
  <a href="/pages/customer/dashboard/" class="sidebar-brand"><div class="sidebar-brand-icon"><i class="bi bi-bag-heart-fill"></i></div><div class="sidebar-brand-text">Shop<span>Ease</span><span class="sidebar-brand-sub">Admin Panel</span></div></a>
  <nav class="sidebar-nav">
    <div class="sidebar-section-label">Main</div>
    <div class="sidebar-nav-item"><a href="/pages/customer/dashboard/" class="sidebar-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
    <div class="sidebar-section-label">Catalog</div>
    <div class="sidebar-nav-item"><a href="/pages/admin/products/" class="sidebar-nav-link active"><i class="bi bi-box-seam"></i><span>Products</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/add-product/" class="sidebar-nav-link"><i class="bi bi-plus-circle"></i><span>Add Product</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/guest/categories/" class="sidebar-nav-link"><i class="bi bi-grid-3x3-gap"></i><span>Categories</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/customer/orders/" class="sidebar-nav-link"><i class="bi bi-bag-check"></i><span>Orders</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/customers/" class="sidebar-nav-link"><i class="bi bi-people"></i><span>Customers</span></a></div>
    <div class="sidebar-nav-item"><a href="#" class="sidebar-nav-link" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></div>
  </nav>
</aside>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-bottom-nav d-flex d-lg-none" style="z-index:1030">
  <a href="/pages/admin/dashboard/" data-page="dashboard"><i class="bi bi-speedometer2"></i>Home</a>
  <a href="/pages/admin/products/" data-page="products"><i class="bi bi-box-seam"></i>Products</a>
  <a href="/pages/admin/orders/" data-page="orders"><i class="bi bi-bag-check"></i>Orders</a>
  <a href="/pages/admin/customers/" data-page="customers"><i class="bi bi-people"></i>Users</a>
  <a href="/pages/admin/reports/" data-page="reports"><i class="bi bi-graph-up"></i>Reports</a>
</nav>
<div class="admin-main">
  <div class="admin-topbar">
    <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <div class="topbar-breadcrumb">Catalog / Products / <strong id="editProductName">Edit Product</strong></div>
    <div class="topbar-actions"><div class="topbar-user"><div class="topbar-user-avatar">A</div></div></div>
  </div>
  <div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div><h4 class="fw-800 mb-0" style="color:#0d2b55">Edit Product</h4></div>
      <a href="/pages/admin/products/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
    </div>

    <form onsubmit="updateProduct(event)" id="editForm">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="form-card mb-4">
            <div class="form-card-header"><h6 class="form-card-title"><i class="bi bi-info-circle me-2"></i>Basic Information</h6></div>
            <div class="form-card-body">
              <div class="mb-3"><label class="form-label fw-600">Product Name</label><input type="text" class="form-control" id="pName" required /></div>
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label fw-600">Category</label>
                  <select class="form-select" id="pCategory"><option>Electronics</option><option>Clothing</option><option>Footwear</option><option>Bags</option></select>
                </div>
                <div class="col-md-6"><label class="form-label fw-600">Brand</label><input type="text" class="form-control" id="pBrand" /></div>
              </div>
              <div class="mt-3"><label class="form-label fw-600">Description</label><textarea class="form-control" rows="5" id="pDesc"></textarea></div>
            </div>
          </div>
          <div class="form-card">
            <div class="form-card-header"><h6 class="form-card-title"><i class="bi bi-tag me-2"></i>Pricing & Stock</h6></div>
            <div class="form-card-body">
              <div class="row g-3">
                <div class="col-md-4"><label class="form-label fw-600">Regular Price (₱)</label><input type="number" class="form-control" id="pPrice" /></div>
                <div class="col-md-4"><label class="form-label fw-600">Sale Price (₱)</label><input type="number" class="form-control" id="pOldPrice" /></div>
                <div class="col-md-4"><label class="form-label fw-600">Stock</label><input type="number" class="form-control" id="pStock" /></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="form-card mb-4">
            <div class="form-card-header"><h6 class="form-card-title">Current Image</h6></div>
            <div class="form-card-body text-center">
              <div style="font-size:6rem" id="pImagePreview">📦</div>
              <div class="mt-2"><label class="form-label fw-600">Image Emoji</label><input type="text" class="form-control" id="pImage" oninput="updatePreview(this.value)" /></div>
            </div>
          </div>
          <div class="form-card mb-4">
            <div class="form-card-header"><h6 class="form-card-title">Status</h6></div>
            <div class="form-card-body">
              <div class="mb-2"><label class="form-label fw-600">Product Status</label><select class="form-select" id="pStatus"><option>Active</option><option>Inactive</option><option>Draft</option></select></div>
              <div class="mb-2"><label class="form-label fw-600">Badge</label><select class="form-select" id="pBadge"><option value="">None</option><option value="new">New</option><option value="hot">Hot</option><option value="sale">Sale</option></select></div>
            </div>
          </div>
          <div class="d-flex flex-column gap-2">
            <button type="submit" class="btn btn-navy py-2"><i class="bi bi-check-circle me-2"></i>Update Product</button>
            <a href="/pages/admin/products/" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id')) || 1;
  const p = SAMPLE_PRODUCTS.find(x => x.id === id) || SAMPLE_PRODUCTS[0];
  document.getElementById('editProductName').textContent = p.name;
  document.getElementById('pName').value = p.name;
  document.getElementById('pCategory').value = p.category;
  document.getElementById('pDesc').value = p.description;
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pOldPrice').value = p.oldPrice || '';
  document.getElementById('pStock').value = p.stock;
  document.getElementById('pImage').value = p.image;
  document.getElementById('pImagePreview').textContent = p.image;
  if (p.badge) document.getElementById('pBadge').value = p.badge;
});

function updatePreview(val) { document.getElementById('pImagePreview').textContent = val || '📦'; }
function updateProduct(e) { e.preventDefault(); showToast('Product updated successfully!', 'success'); setTimeout(() => window.location.href = '/products/', 800); }
</script>
<script src="/static/js/responsive.js"></script>
</body>
</html>
