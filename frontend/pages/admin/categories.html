<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Management - ShopEase Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <link href="/static/css/admin.css" rel="stylesheet" />
</head>
<body class="admin-body">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="admin-sidebar" id="adminSidebar">
  <a href="/pages/customer/dashboard/" class="sidebar-brand"><div class="sidebar-brand-icon"><i class="bi bi-bag-heart-fill"></i></div><div class="sidebar-brand-text">Shop<span>Ease</span><span class="sidebar-brand-sub">Admin Panel</span></div></a>
  <nav class="sidebar-nav">
    <div class="sidebar-nav-item"><a href="/pages/customer/dashboard/" class="sidebar-nav-link"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/products/" class="sidebar-nav-link"><i class="bi bi-box-seam"></i><span>Products</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/add-product/" class="sidebar-nav-link"><i class="bi bi-plus-circle"></i><span>Add Product</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/guest/categories/" class="sidebar-nav-link active"><i class="bi bi-grid-3x3-gap"></i><span>Categories</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/inventory/" class="sidebar-nav-link"><i class="bi bi-bar-chart-steps"></i><span>Inventory</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/customer/orders/" class="sidebar-nav-link"><i class="bi bi-bag-check"></i><span>Orders</span></a></div>
    <div class="sidebar-nav-item"><a href="/pages/admin/customers/" class="sidebar-nav-link"><i class="bi bi-people"></i><span>Customers</span></a></div>
    <div class="sidebar-nav-item"><a href="#" class="sidebar-nav-link" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></div>
  </nav>
</aside>
<div class="admin-main">
  <div class="admin-topbar">
    <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
    <div class="topbar-breadcrumb">Catalog / <strong>Categories</strong></div>
    <div class="topbar-actions"><div class="topbar-user"><div class="topbar-user-avatar">A</div></div></div>
  </div>
  <div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-800 mb-0" style="color:#0d2b55">Category Management</h4>
      <button class="btn btn-navy btn-sm" data-bs-toggle="modal" data-bs-target="#addCatModal"><i class="bi bi-plus-circle me-1"></i>Add Category</button>
    </div>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="admin-table-card">
          <div class="admin-table-header"><div class="admin-table-title">All Categories</div></div>
          <div class="table-responsive">
            <table class="table admin-table">
              <thead><tr><th>Icon</th><th>Name</th><th>Products</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="catsTbody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div style="background:#fff;border:1px solid #e9ecef;border-radius:12px;overflow:hidden">
          <div class="admin-table-header"><div class="admin-table-title">Quick Add Category</div></div>
          <div class="p-4">
            <form onsubmit="addCategory(event)">
              <div class="mb-3"><label class="form-label fw-600">Category Name</label><input type="text" class="form-control" id="newCatName" placeholder="e.g. Accessories" required /></div>
              <div class="mb-3"><label class="form-label fw-600">Icon (Emoji)</label><input type="text" class="form-control" id="newCatIcon" placeholder="e.g. 💍" maxlength="2" /></div>
              <div class="mb-3"><label class="form-label fw-600">Description</label><textarea class="form-control" rows="2" placeholder="Category description..."></textarea></div>
              <div class="mb-3"><label class="form-label fw-600">Status</label><select class="form-select"><option>Active</option><option>Inactive</option></select></div>
              <button type="submit" class="btn btn-navy w-100"><i class="bi bi-plus me-1"></i>Add Category</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/admin.js"></script>
<script>
let categories = [...SAMPLE_CATEGORIES];
document.addEventListener('DOMContentLoaded', renderCatTable);

function renderCatTable() {
  document.getElementById('catsTbody').innerHTML = categories.map(c => `
    <tr>
      <td style="font-size:1.5rem">${c.icon}</td>
      <td class="fw-600">${c.name}</td>
      <td>${c.count}</td>
      <td><span class="status-badge status-active">Active</span></td>
      <td>
        <div class="d-flex gap-1">
          <button class="btn btn-xs btn-outline-secondary" style="font-size:0.75rem;padding:0.2rem 0.6rem" onclick="showToast('Edit ${c.name}','info')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-xs btn-outline-danger" style="font-size:0.75rem;padding:0.2rem 0.6rem" onclick="deleteCategory('${c.name}')"><i class="bi bi-trash"></i></button>
        </div>
      </td>
    </tr>`).join('');
}

function addCategory(e) {
  e.preventDefault();
  const name = document.getElementById('newCatName').value;
  const icon = document.getElementById('newCatIcon').value || '📦';
  categories.push({ id: Date.now(), name, icon, count: 0, color: '#e9ecef' });
  renderCatTable();
  e.target.reset();
  showToast(`Category "<b>${name}</b>" added!`, 'success');
}

function deleteCategory(name) {
  if (confirm(`Delete category "${name}"?`)) {
    categories = categories.filter(c => c.name !== name);
    renderCatTable();
    showToast(`Category deleted.`, 'info');
  }
}
</script>
</body>
</html>
