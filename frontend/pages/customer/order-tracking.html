<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="theme-color" content="#0d2b55" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order Tracking - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    .track-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
    .track-step::before { content: ''; position: absolute; top: 24px; right: -50%; width: 100%; height: 3px; background: #dee2e6; z-index: 0; }
    .track-step:last-child::before { display: none; }
    .track-step.done::before { background: #28a745; }
    .track-icon { width: 50px; height: 50px; border-radius: 50%; background: #dee2e6; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; z-index: 1; margin-bottom: 0.7rem; transition: all 0.3s; }
    .track-step.done .track-icon { background: #28a745; color: white; }
    .track-step.active .track-icon { background: var(--accent); color: white; box-shadow: 0 0 0 5px rgba(26,111,196,0.2); }
    .track-label { font-size: 0.8rem; font-weight: 600; text-align: center; }
    .track-date { font-size: 0.72rem; color: #6c757d; text-align: center; margin-top: 0.2rem; }
    .customer-layout { display: flex; min-height: 100vh; background: #f8f9fa; }
    .customer-sidebar { width: 240px; background: var(--navy); color: white; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
    .customer-main { flex: 1;  }
    .cust-nav-link { display: flex; align-items: center; gap: 0.7rem; color: rgba(255,255,255,0.75); padding: 0.7rem 1.2rem; text-decoration: none; border-radius: 8px; margin: 0.15rem 0.6rem; transition: all 0.2s; font-size: 0.9rem; }
    .cust-nav-link:hover, .cust-nav-link.active { background: rgba(255,255,255,0.15); color: white; }
    .log-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #f0f0f0; }
    .log-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
  </style>
</head>
<body>
<nav class="main-navbar navbar">
  <div class="container-fluid px-3 px-md-4">
    <button id="custSidebarToggle" class="btn p-1 me-2 d-lg-none" style="background:rgba(255,255,255,0.1);color:white;border:none;font-size:1.4rem;border-radius:6px" aria-label="Menu"><i class="bi bi-list"></i></button>
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="ms-auto"><button onclick="Auth.logout()" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button></div>
  </div>
</nav>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-bottom-nav d-flex d-lg-none">
  <a href="/" data-page="index"><i class="bi bi-house-fill"></i>Home</a>
  <a href="/pages/guest/catalog/" data-page="catalog"><i class="bi bi-shop"></i>Shop</a>
  <a href="/pages/customer/orders/" data-page="orders"><i class="bi bi-bag-check"></i>Orders</a>
  <a href="/pages/customer/cart/" data-page="cart"><i class="bi bi-cart3"></i>Cart<span class="mob-cart-badge" style="display:none">0</span></a>
  <a href="/pages/customer/dashboard/" data-page="dashboard"><i class="bi bi-person-check"></i>Account</a>
</nav>

<div class="cust-sidebar-overlay" id="custSidebarOverlay"></div>
<div class="customer-layout">
  <div class="customer-sidebar">
    <div class="p-3 border-bottom" style="border-color:rgba(255,255,255,0.1)!important">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#1a6fc4,#f0a500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:white">M</div>
    </div>
    <nav class="pt-2">
      <a href="/pages/customer/dashboard/" class="cust-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="/pages/customer/orders/" class="cust-nav-link active"><i class="bi bi-box-seam"></i>My Orders</a>
      <a href="/pages/customer/cart/" class="cust-nav-link"><i class="bi bi-cart3"></i>Shopping Cart</a>
    </nav>
  </div>
  <div class="customer-main">
    <div class="mb-3"><a href="/pages/customer/orders/" class="text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Orders</a></div>
    <h3 class="fw-800 mb-4" style="color:var(--navy)">Order Tracking</h3>
    <div id="trackingContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id') || SAMPLE_ORDERS[1].id;
  const order = SAMPLE_ORDERS.find(o => o.id === orderId) || SAMPLE_ORDERS[1];
  renderTracking(order);
});

function renderTracking(order) {
  const steps = [
    { key: 'Pending', icon: '📋', label: 'Order Placed', date: 'Oct 30, 9:00 AM' },
    { key: 'Processing', icon: '⚙️', label: 'Processing', date: 'Oct 30, 2:30 PM' },
    { key: 'Shipped', icon: '🚚', label: 'Shipped', date: 'Oct 31, 8:00 AM' },
    { key: 'Delivered', icon: '✅', label: 'Delivered', date: 'Nov 2, 3:00 PM' },
  ];
  const statusOrder = ['Pending','Processing','Shipped','Delivered'];
  const currentIdx = statusOrder.indexOf(order.status);

  const logs = [
    { icon: '📦', color: '#0d2b55', time: 'Nov 2, 3:00 PM', msg: 'Package delivered to recipient' },
    { icon: '🏠', color: '#28a745', time: 'Nov 2, 12:00 PM', msg: 'Out for delivery in your area' },
    { icon: '🏭', color: '#1a6fc4', time: 'Nov 1, 6:00 AM', msg: 'Package arrived at Manila sorting hub' },
    { icon: '🚛', color: '#ffc107', time: 'Oct 31, 8:00 AM', msg: 'Package picked up from seller warehouse' },
    { icon: '📋', color: '#6c757d', time: 'Oct 30, 2:30 PM', msg: 'Order processed and packed' },
    { icon: '💳', color: '#28a745', time: 'Oct 30, 9:00 AM', msg: 'Payment confirmed via GCash' },
  ];

  document.getElementById('trackingContent').innerHTML = `
    <div class="row g-4">
      <div class="col-lg-8">
        <!-- Progress -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:2rem;margin-bottom:1.5rem">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <div class="fw-700" style="color:var(--navy)">${order.id}</div>
              <div class="text-muted" style="font-size:0.82rem">Placed on ${formatDate(order.date)}</div>
            </div>
            ${getStatusBadge(order.status)}
          </div>
          <div class="d-flex overflow-auto pb-2">
            ${steps.map((step, i) => `
            <div class="track-step ${i < currentIdx ? 'done' : (i === currentIdx ? 'active' : '')}">
              <div class="track-icon">${i <= currentIdx ? (i < currentIdx ? '✓' : step.icon) : step.icon}</div>
              <div class="track-label">${step.label}</div>
              ${i <= currentIdx ? `<div class="track-date">${step.date}</div>` : '<div class="track-date text-muted">—</div>'}
            </div>`).join('')}
          </div>
          ${order.status === 'Shipped' ? `
          <div class="mt-4 p-3" style="background:#e8f0fe;border-radius:10px;border-left:4px solid var(--accent)">
            <div class="fw-700 mb-1"><i class="bi bi-truck me-1"></i>In Transit</div>
            <div style="font-size:0.88rem">Your package is on its way! Expected delivery: <strong>November 3–4, 2026</strong></div>
            <div class="mt-1 text-muted" style="font-size:0.82rem">Courier: J&T Express · Tracking No: <strong>JT-${Math.floor(Math.random()*9000000)+1000000}</strong></div>
          </div>` : ''}
        </div>

        <!-- Shipment Log -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem">
          <h6 class="fw-700 mb-3">Shipment Activity</h6>
          ${logs.slice(0, currentIdx + 2).map(log => `
          <div class="log-item">
            <div class="log-icon" style="background:${log.color}20;color:${log.color}">${log.icon}</div>
            <div>
              <div class="fw-600" style="font-size:0.9rem">${log.msg}</div>
              <div class="text-muted" style="font-size:0.78rem">${log.time}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>

      <div class="col-lg-4">
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem;margin-bottom:1rem">
          <h6 class="fw-700 mb-3">Delivery Address</h6>
          <div class="d-flex gap-2 mb-2"><i class="bi bi-person text-muted"></i><span>Maria Santos</span></div>
          <div class="d-flex gap-2 mb-2"><i class="bi bi-geo-alt text-muted"></i><span>123 Rizal Street, Manila City</span></div>
          <div class="d-flex gap-2"><i class="bi bi-telephone text-muted"></i><span>+63 912 345 6789</span></div>
        </div>
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem">
          <h6 class="fw-700 mb-3">Order Summary</h6>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted">Amount</span><span class="fw-700">${formatPrice(order.total)}</span></div>
          <div class="d-flex justify-content-between mb-1"><span class="text-muted">Payment</span><span class="fw-600">GCash</span></div>
          <div class="d-flex justify-content-between"><span class="text-muted">Items</span><span class="fw-600">${order.items}</span></div>
        </div>
      </div>
    </div>`;
}
</script>
<script src="/static/js/responsive.js"></script>
</body>
</html>
