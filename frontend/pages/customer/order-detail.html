<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    .customer-layout { display: flex; min-height: 100vh; background: #f8f9fa; }
    .customer-sidebar { width: 240px; background: var(--navy); color: white; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
    .customer-main { flex: 1; padding: 2rem; }
    .cust-nav-link { display: flex; align-items: center; gap: 0.7rem; color: rgba(255,255,255,0.75); padding: 0.7rem 1.2rem; text-decoration: none; border-radius: 8px; margin: 0.15rem 0.6rem; transition: all 0.2s; font-size: 0.9rem; }
    .cust-nav-link:hover, .cust-nav-link.active { background: rgba(255,255,255,0.15); color: white; }
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: #dee2e6; }
    .timeline-item { position: relative; padding-bottom: 1.5rem; }
    .timeline-dot { position: absolute; left: -1.5rem; width: 22px; height: 22px; border-radius: 50%; background: #dee2e6; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: white; }
    .timeline-dot.done { background: #28a745; }
    .timeline-dot.active { background: var(--accent); box-shadow: 0 0 0 4px rgba(26,111,196,0.2); }
  </style>
</head>
<body>
<nav class="main-navbar navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="ms-auto"><button onclick="Auth.logout()" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button></div>
  </div>
</nav>
<div class="customer-layout">
  <div class="customer-sidebar">
    <div class="p-3 border-bottom" style="border-color:rgba(255,255,255,0.1)!important">
      <div class="d-flex align-items-center gap-2">
        <div style="width:44px;height:44px;background:linear-gradient(135deg,#1a6fc4,#f0a500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem">M</div>
        <div><div class="fw-700 nav-user-name" style="color:white">Maria Santos</div><div style="font-size:0.75rem;color:rgba(255,255,255,0.5)">Customer Account</div></div>
      </div>
    </div>
    <nav class="pt-2">
      <a href="/pages/customer/dashboard/" class="cust-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="/pages/customer/profile/" class="cust-nav-link"><i class="bi bi-person"></i>My Profile</a>
      <a href="/pages/customer/orders/" class="cust-nav-link active"><i class="bi bi-box-seam"></i>My Orders</a>
      <a href="/pages/customer/cart/" class="cust-nav-link"><i class="bi bi-cart3"></i>Shopping Cart</a>
    </nav>
  </div>
  <div class="customer-main">
    <div class="mb-3">
      <a href="/pages/customer/orders/" class="text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Orders</a>
    </div>
    <div id="orderDetailContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id') || SAMPLE_ORDERS[0].id;
  const order = SAMPLE_ORDERS.find(o => o.id === orderId) || SAMPLE_ORDERS[0];
  renderOrderDetail(order);
});

function renderOrderDetail(order) {
  const items = SAMPLE_PRODUCTS.slice(0, order.items);
  const statusSteps = ['Pending','Processing','Shipped','Delivered'];
  const currentStep = statusSteps.indexOf(order.status);

  document.getElementById('orderDetailContent').innerHTML = `
    <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
      <div>
        <h3 class="fw-800 mb-1" style="color:var(--navy)">${order.id}</h3>
        <div class="text-muted" style="font-size:0.88rem">Placed on ${formatDate(order.date)}</div>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        ${getStatusBadge(order.status)}
        <a href="/pages/customer/order-tracking/?id=${order.id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-geo-alt me-1"></i>Track Order</a>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <!-- Items -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;overflow:hidden;margin-bottom:1.5rem">
          <div class="p-3 border-bottom" style="background:#f8f9fa"><h6 class="fw-700 mb-0">Order Items</h6></div>
          <div class="p-3">
            ${items.map(p => `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom last:border-0">
              <div style="width:60px;height:60px;background:#f8f9fa;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0">${p.image}</div>
              <div class="flex-fill">
                <div class="fw-600">${p.name}</div>
                <div class="text-muted" style="font-size:0.82rem">${p.category}</div>
              </div>
              <div class="text-end">
                <div class="fw-700" style="color:var(--navy)">${formatPrice(p.price)}</div>
                <div class="text-muted" style="font-size:0.8rem">×1</div>
              </div>
            </div>`).join('')}
          </div>
        </div>

        <!-- Order Timeline -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem">
          <h6 class="fw-700 mb-3">Order Timeline</h6>
          <div class="timeline">
            ${statusSteps.map((step, i) => {
              let dotClass = i < currentStep ? 'done' : (i === currentStep ? 'active' : '');
              const times = ['Oct 28, 9:00 AM','Oct 28, 2:00 PM','Oct 29, 8:00 AM','Oct 31, 3:00 PM'];
              const descs = ['Your order has been received and is being reviewed.','Payment verified. Your order is being prepared.','Your order has been picked up by the courier.','Order delivered to your address.'];
              return `
              <div class="timeline-item">
                <div class="timeline-dot ${dotClass}"><i class="bi bi-check"></i></div>
                <div class="ms-1">
                  <div class="fw-600 ${i > currentStep ? 'text-muted' : ''}">${step}</div>
                  ${i <= currentStep ? `<div class="text-muted" style="font-size:0.82rem">${times[i]}</div>
                  <div style="font-size:0.85rem;margin-top:0.2rem">${descs[i]}</div>` : `<div class="text-muted" style="font-size:0.82rem">Pending</div>`}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <!-- Summary -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem;margin-bottom:1rem">
          <h6 class="fw-700 mb-3">Payment Summary</h6>
          <div class="d-flex justify-content-between mb-2"><span class="text-muted">Subtotal</span><span class="fw-600">${formatPrice(order.total)}</span></div>
          <div class="d-flex justify-content-between mb-2"><span class="text-muted">Shipping</span><span class="text-success fw-600">FREE</span></div>
          <hr>
          <div class="d-flex justify-content-between"><span class="fw-700">Total</span><span class="fw-800" style="color:var(--navy);font-size:1.2rem">${formatPrice(order.total)}</span></div>
          <div class="mt-3 p-2" style="background:#f8f9fa;border-radius:8px;font-size:0.85rem">
            <i class="bi bi-phone me-1 text-primary"></i><strong>Payment:</strong> ${order.payment}
          </div>
        </div>

        <!-- Delivery Info -->
        <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;padding:1.5rem">
          <h6 class="fw-700 mb-3">Delivery Information</h6>
          <div class="mb-2"><div class="text-muted" style="font-size:0.8rem">RECIPIENT</div><div class="fw-600">Maria Santos</div></div>
          <div class="mb-2"><div class="text-muted" style="font-size:0.8rem">ADDRESS</div><div>123 Rizal Street, Manila City</div></div>
          <div><div class="text-muted" style="font-size:0.8rem">CONTACT</div><div>+63 912 345 6789</div></div>
        </div>
      </div>
    </div>`;
}
</script>
</body>
</html>
