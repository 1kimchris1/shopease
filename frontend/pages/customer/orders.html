<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="theme-color" content="#0d2b55" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Orders - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  
</head>
<body>
<nav class="main-navbar navbar">
  <div class="container-fluid px-3 px-md-4">
    <button id="custSidebarToggle" class="btn p-1 me-2 d-lg-none" style="background:rgba(255,255,255,0.1);color:white;border:none;font-size:1.4rem;border-radius:6px" aria-label="Menu"><i class="bi bi-list"></i></button>
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <a href="/pages/customer/cart/" class="navbar-cart-btn"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
      <button onclick="Auth.logout()" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </div>
</nav>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-bottom-nav d-flex d-lg-none">
  <a href="/" data-page="index"><i class="bi bi-house-fill"></i>Home</a>
  <a href="/pages/guest/catalog/" data-page="catalog"><i class="bi bi-shop"></i>Shop</a>
  <a href="/pages/customer/orders/" data-page="orders"><i class="bi bi-bag-check"></i>Orders</a>
  <a href="/pages/customer/cart/" data-page="cart"><i class="bi bi-cart3"></i>Cart<span class="mob-cart-badge" style="display:none">0</span></a>
  <a href="/pages/customer/dashboard/" data-page="dashboard"><i class="bi bi-person-check"></i>Account</a>
</nav>

<div class="cust-sidebar-overlay" id="custSidebarOverlay"></div>
<div class="customer-layout">
  <div class="customer-sidebar">
    <div class="p-3 border-bottom" style="border-color:rgba(255,255,255,0.1)!important">
      <div class="d-flex align-items-center gap-2">
        <div style="width:44px;height:44px;background:linear-gradient(135deg,#1a6fc4,#f0a500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem">M</div>
        <div><div class="fw-700 nav-user-name" style="color:white">Maria Santos</div><div style="font-size:0.75rem;color:rgba(255,255,255,0.5)">Customer Account</div></div>
      </div>
    </div>
    <nav class="pt-2">
      <a href="/pages/customer/dashboard/" class="cust-nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
      <a href="/pages/customer/profile/" class="cust-nav-link"><i class="bi bi-person"></i>My Profile</a>
      <a href="/pages/customer/orders/" class="cust-nav-link active"><i class="bi bi-box-seam"></i>My Orders</a>
      <a href="/pages/customer/cart/" class="cust-nav-link"><i class="bi bi-cart3"></i>Shopping Cart</a>
      <a href="/pages/customer/checkout/" class="cust-nav-link"><i class="bi bi-credit-card"></i>Checkout</a>
      <a href="/" class="cust-nav-link mt-3"><i class="bi bi-shop"></i>Continue Shopping</a>
      <a href="#" class="cust-nav-link text-danger" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i>Sign Out</a>
    </nav>
  </div>
  <div class="customer-main">
    <div class="mb-4 d-flex justify-content-between align-items-center">
      <div><h3 class="fw-800 mb-1" style="color:var(--navy)">My Orders</h3><p class="text-muted mb-0">Track and manage your orders</p></div>
    </div>
    <!-- Filter tabs -->
    <div class="d-flex gap-2 mb-4 overflow-auto pb-1 flex-nowrap flex-md-wrap" style="-webkit-overflow-scrolling:touch;scrollbar-width:none">
      <button class="btn btn-navy btn-sm" onclick="filterOrders('all', this)">All Orders</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('Pending', this)">Pending</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('Processing', this)">Processing</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('Shipped', this)">Shipped</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('Delivered', this)">Delivered</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('Cancelled', this)">Cancelled</button>
    </div>
    <div id="ordersList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const user = Auth.getUser();
  if (!user) { window.location.href = '/pages/guest/login/'; return; }
  renderOrders('all');
});

function filterOrders(status, btn) {
  document.querySelectorAll('.d-flex.gap-2.mb-4 button').forEach(b => {
    b.className = 'btn btn-outline-secondary btn-sm';
  });
  btn.className = 'btn btn-navy btn-sm';
  renderOrders(status);
}

function renderOrders(status) {
  const orders = status === 'all' ? SAMPLE_ORDERS : SAMPLE_ORDERS.filter(o => o.status === status);
  const div = document.getElementById('ordersList');
  if (orders.length === 0) {
    div.innerHTML = `<div class="text-center py-5"><div style="font-size:3rem">📦</div><h5 class="mt-3">No ${status === 'all' ? '' : status} orders</h5></div>`;
    return;
  }
  div.innerHTML = orders.map(o => `
    <div style="background:#fff;border:1px solid #dee2e6;border-radius:12px;margin-bottom:1rem;overflow:hidden">
      <div style="background:#f8f9fa;padding:0.8rem 1.2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
        <div class="d-flex gap-3 align-items-center flex-wrap">
          <span class="fw-700" style="color:var(--navy)">${o.id}</span>
          <span class="text-muted" style="font-size:0.82rem"><i class="bi bi-calendar me-1"></i>${formatDate(o.date)}</span>
        </div>
        <div class="d-flex gap-2 align-items-center">${getStatusBadge(o.status)}</div>
      </div>
      <div style="padding:1.2rem;display:flex;align-items:center;gap:2rem;flex-wrap:wrap">
        <div style="font-size:2.5rem">📦</div>
        <div class="flex-fill">
          <div class="fw-600 mb-1">${o.items} item${o.items>1?'s':''} · Payment: ${o.payment}</div>
          <div class="fw-800" style="font-size:1.15rem;color:var(--navy)">${formatPrice(o.total)}</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a href="/pages/customer/order-detail/?id=${o.id}" class="btn btn-sm btn-navy"><i class="bi bi-eye me-1"></i>View Details</a>
          ${o.status === 'Shipped' || o.status === 'Processing' ? `<a href="/pages/customer/order-tracking/?id=${o.id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-geo-alt me-1"></i>Track</a>` : ''}
          ${o.status === 'Pending' ? `<button class="btn btn-sm btn-outline-danger" onclick="showToast('Cancel request submitted.','info')"><i class="bi bi-x me-1"></i>Cancel</button>` : ''}
        </div>
      </div>
    </div>`).join('');
}
</script>
<script src="/static/js/responsive.js"></script>
</body>
</html>
