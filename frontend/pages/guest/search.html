<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto ms-3">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/catalog/">Shop</a></li>
      </ul>
      <form class="navbar-search-form me-3" id="searchForm" onsubmit="event.preventDefault(); doSearch()">
        <input type="text" id="searchInput" placeholder="Search products..." />
        <button type="submit"><i class="bi bi-search"></i></button>
      </form>
      <a href="/pages/customer/cart/" class="navbar-cart-btn me-2"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
      <a href="/pages/guest/login/" class="btn btn-outline-light btn-sm nav-login-link"><i class="bi bi-person me-1"></i>Sign In</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container-fluid px-4">
    <h1 id="searchTitle">Search Results</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/">Home</a></li><li class="breadcrumb-item active">Search</li></ol></nav>
  </div>
</div>

<div class="container-fluid px-4 py-5">
  <div id="searchMeta" class="mb-4 text-muted"></div>
  <div class="row g-3" id="searchResults"></div>
</div>

<footer class="main-footer"><div class="footer-bottom"><div class="container-fluid px-4 text-center"><span>&copy; 2026 ShopEase.</span></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q') || '';
  document.getElementById('searchInput').value = q;
  if (q) { document.getElementById('searchTitle').textContent = 'Search: "' + q + '"'; doSearch(q); }
});

function doSearch(query) {
  query = query || document.getElementById('searchInput').value;
  if (!query.trim()) return;
  const results = SAMPLE_PRODUCTS.filter(p =>
    p.name.toLowerCase().includes(query.toLowerCase()) ||
    p.category.toLowerCase().includes(query.toLowerCase()) ||
    p.description.toLowerCase().includes(query.toLowerCase())
  );
  document.getElementById('searchMeta').innerHTML = `Found <strong>${results.length}</strong> result${results.length!==1?'s':''} for &ldquo;<strong>${query}</strong>&rdquo;`;
  const grid = document.getElementById('searchResults');
  if (!results.length) {
    grid.innerHTML = `<div class="col-12 text-center py-5"><i class="bi bi-search" style="font-size:4rem;color:#dee2e6"></i><h4 class="mt-3">No products found</h4><p class="text-muted">Try different keywords or <a href="/pages/guest/catalog/">browse all products</a></p></div>`;
    return;
  }
  grid.innerHTML = results.map(p => `
    <div class="col-6 col-md-4 col-lg-3">
      <div class="product-card h-100">
        <div class="product-card-img"><span style="font-size:3.5rem">${p.image}</span></div>
        <div class="product-card-body">
          <div class="product-card-category">${p.category}</div>
          <div class="product-card-title">${p.name}</div>
          <div class="product-stars">${renderStars(p.rating)}<span>(${p.reviews})</span></div>
          <div class="product-price">${formatPrice(p.price)}</div>
        </div>
        <div class="product-card-footer">
          <button class="btn btn-sm btn-navy flex-fill" onclick="Cart.add(${p.id})"><i class="bi bi-cart-plus me-1"></i>Add</button>
          <a href="/pages/guest/product-detail/?id=${p.id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
        </div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
