<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="bi bi-list" style="font-size:1.5rem"></i></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-3">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/catalog/">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/categories/">Categories</a></li>
      </ul>
      <form class="navbar-search-form me-3" onsubmit="event.preventDefault(); performSearch(this.querySelector('input').value)">
        <input type="text" placeholder="Search products..." /><button type="submit"><i class="bi bi-search"></i></button>
      </form>
      <a href="/pages/customer/cart/" class="navbar-cart-btn me-2"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
      <a href="/pages/guest/login/" class="btn btn-outline-light btn-sm nav-login-link"><i class="bi bi-person me-1"></i>Sign In</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  <nav class="mb-4"><ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
    <li class="breadcrumb-item"><a href="/pages/guest/catalog/" class="text-decoration-none">Shop</a></li>
    <li class="breadcrumb-item active" id="breadcrumbName">Product</li>
  </ol></nav>
  <div id="productDetailContent"></div>
  <div class="mt-5">
    <h4 class="fw-bold mb-4" style="color:var(--navy)">Related Products</h4>
    <div class="row g-3" id="relatedProducts"></div>
  </div>
</div>

<footer class="main-footer mt-5"><div class="footer-bottom"><div class="container-fluid px-4 text-center"><span>&copy; 2026 ShopEase.</span></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id')) || 1;
  const product = SAMPLE_PRODUCTS.find(p => p.id === id) || SAMPLE_PRODUCTS[0];
  renderProduct(product);
  renderRelated(product);
});

function renderProduct(p) {
  document.title = p.name + ' - ShopEase';
  document.getElementById('breadcrumbName').textContent = p.name;
  const disc = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  document.getElementById('productDetailContent').innerHTML = `
    <div class="row g-5">
      <div class="col-md-5">
        <div style="background:#f8f9fa;border-radius:16px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9rem;margin-bottom:1rem;border:1px solid #dee2e6" class="product-image-zoom">${p.image}</div>
        <div class="d-flex gap-2 justify-content-center">
          ${[1,2,3,4].map(i=>`<div style="width:70px;height:70px;background:#f8f9fa;border-radius:8px;border:2px solid ${i===1?'var(--accent)':'#dee2e6'};display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer">${p.image}</div>`).join('')}
        </div>
      </div>
      <div class="col-md-7">
        <div class="d-flex gap-2 mb-2 flex-wrap">
          <span class="badge" style="background:var(--accent-light);color:white;padding:0.3rem 0.8rem">${p.category}</span>
          ${p.badge?`<span class="product-badge badge-${p.badge} position-static">${p.badge.toUpperCase()}</span>`:''}
          ${p.stock<=10?'<span class="badge bg-danger">Low Stock</span>':'<span class="badge bg-success">In Stock</span>'}
        </div>
        <h1 class="fw-bold mb-3" style="font-size:1.9rem;color:var(--navy)">${p.name}</h1>
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="product-stars" style="font-size:1.1rem">${renderStars(p.rating)}</div>
          <span class="text-muted">${p.rating} / 5 (${p.reviews} reviews)</span>
        </div>
        <div class="mb-4 p-3" style="background:#f8f9fa;border-radius:10px">
          <span style="font-size:2.2rem;font-weight:800;color:var(--navy)">${formatPrice(p.price)}</span>
          ${p.oldPrice?`<span class="product-price-old ms-2">${formatPrice(p.oldPrice)}</span><span class="badge bg-danger ms-2">${disc}% OFF</span>`:''}
        </div>
        <p class="text-muted mb-4" style="line-height:1.8">${p.description}</p>
        <div class="mb-4">
          <div class="d-flex gap-3 align-items-center mb-3 flex-wrap">
            <label class="fw-bold">Quantity:</label>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-secondary btn-sm px-3" onclick="changeQty(-1)">&minus;</button>
              <input type="number" id="qtyInput" value="1" min="1" max="${p.stock}" style="width:70px;text-align:center" class="form-control form-control-sm">
              <button class="btn btn-outline-secondary btn-sm px-3" onclick="changeQty(1)">+</button>
            </div>
            <span class="text-muted" style="font-size:0.85rem">${p.stock} available</span>
          </div>
        </div>
        <div class="d-flex gap-3 flex-wrap mb-4">
          <button class="btn-navy btn flex-fill" onclick="addWithQty(${p.id})"><i class="bi bi-cart-plus me-2"></i>Add to Cart</button>
          <a href="/pages/customer/checkout/" class="btn btn-warning fw-bold flex-fill" onclick="Cart.add(${p.id})" style="color:var(--navy)"><i class="bi bi-lightning-fill me-1"></i>Buy Now</a>
          <button class="btn btn-outline-secondary" title="Wishlist"><i class="bi bi-heart"></i></button>
          <button class="btn btn-outline-secondary" title="Share"><i class="bi bi-share"></i></button>
        </div>
        <div style="border-top:1px solid #dee2e6;padding-top:1rem">
          <div class="d-flex flex-wrap gap-3 text-muted" style="font-size:0.88rem">
            <span><i class="bi bi-truck me-1 text-success"></i>Free delivery over &#8369;1,500</span>
            <span><i class="bi bi-shield-check me-1 text-primary"></i>Secure GCash payment</span>
            <span><i class="bi bi-arrow-repeat me-1 text-warning"></i>30-day easy returns</span>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-5">
      <ul class="nav nav-tabs" id="productTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#descTab">Description</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#specsTab">Specifications</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#reviewsTab">Reviews (${p.reviews})</button></li>
      </ul>
      <div class="tab-content p-4 border border-top-0 rounded-bottom">
        <div class="tab-pane fade show active" id="descTab"><p>${p.description}</p><ul class="mt-3"><li>High-quality materials and construction</li><li>Designed for everyday use and durability</li><li>Backed by manufacturer's warranty</li><li>Authentic product from authorized distributor</li></ul></div>
        <div class="tab-pane fade" id="specsTab">
          <table class="table table-striped"><tbody>
            <tr><th width="200">Category</th><td>${p.category}</td></tr>
            <tr><th>Product ID</th><td>#${String(p.id).padStart(5,'0')}</td></tr>
            <tr><th>Stock</th><td>${p.stock} units</td></tr>
            <tr><th>Rating</th><td>${p.rating}/5 &#9733;</td></tr>
            <tr><th>Reviews</th><td>${p.reviews}</td></tr>
            <tr><th>Availability</th><td><span class="badge bg-success">In Stock</span></td></tr>
            <tr><th>Shipping</th><td>3&ndash;5 business days nationwide</td></tr>
          </tbody></table>
        </div>
        <div class="tab-pane fade" id="reviewsTab">
          <div class="row g-4 mb-4">
            <div class="col-md-3 text-center">
              <div style="font-size:3.5rem;font-weight:800;color:var(--navy)">${p.rating}</div>
              <div class="product-stars" style="font-size:1.3rem;justify-content:center;display:flex">${renderStars(p.rating)}</div>
              <div class="text-muted mt-1">${p.reviews} total reviews</div>
            </div>
            <div class="col-md-9">
              ${[5,4,3,2,1].map(s => { const pct=s===5?55:s===4?28:s===3?10:s===2?5:2; return `<div class="d-flex align-items-center gap-2 mb-1"><span style="width:20px;font-size:0.85rem">${s}&#9733;</span><div class="progress flex-fill" style="height:8px"><div class="progress-bar" style="width:${pct}%;background:var(--gold)"></div></div><span style="width:30px;font-size:0.82rem;color:#6c757d">${pct}%</span></div>`; }).join('')}
            </div>
          </div>
          ${['Maria S.','Jose R.','Ana C.'].map((name,i)=>`
            <div class="d-flex gap-3 py-3 border-top">
              <div style="width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;flex-shrink:0">${name[0]}</div>
              <div><div class="fw-bold">${name}</div><div class="product-stars" style="font-size:0.85rem">${renderStars(5-i*0.5)}</div><div class="text-muted" style="font-size:0.88rem;margin-top:0.3rem">Great product! Exactly as described. Fast shipping and well-packaged. Highly recommended!</div><div class="text-muted" style="font-size:0.78rem;margin-top:0.3rem">October ${20+i*3}, 2026</div></div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}

function changeQty(delta) {
  const input = document.getElementById('qtyInput');
  input.value = Math.max(1, parseInt(input.value || 1) + delta);
}

function addWithQty(productId) {
  Cart.add(productId, parseInt(document.getElementById('qtyInput')?.value || 1));
}

function renderRelated(product) {
  const related = SAMPLE_PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,4);
  document.getElementById('relatedProducts').innerHTML = related.map(p => `
    <div class="col-6 col-md-3">
      <div class="product-card h-100">
        <div class="product-card-img"><span style="font-size:3rem">${p.image}</span></div>
        <div class="product-card-body"><div class="product-card-title">${p.name}</div><div class="product-price">${formatPrice(p.price)}</div></div>
        <div class="product-card-footer">
          <button class="btn btn-sm btn-navy flex-fill" onclick="Cart.add(${p.id})"><i class="bi bi-cart-plus me-1"></i>Add</button>
          <a href="/pages/guest/product-detail/?id=${p.id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
        </div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
