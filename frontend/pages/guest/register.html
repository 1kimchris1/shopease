<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
  <style>
    .auth-body{min-height:calc(100vh - 60px);background:linear-gradient(135deg,#0d2b55,#1a3f7a);display:flex;align-items:center;padding:3rem 1rem}
    .auth-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:600px;margin:0 auto}
    .auth-form-area{padding:2.5rem}
    .form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,111,196,0.15)}
    .strength-bar{height:5px;border-radius:3px;transition:all 0.3s}
  </style>
</head>
<body>
<nav class="main-navbar navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="ms-auto"><a href="/pages/guest/login/" class="btn btn-outline-light btn-sm">Already have an account? Sign In</a></div>
  </div>
</nav>

<div class="auth-body">
  <div class="auth-card">
    <div class="auth-form-area">
      <div class="text-center mb-4">
        <div style="font-size:2.5rem">&#127881;</div>
        <h3 class="fw-bold" style="color:var(--navy)">Create Your Account</h3>
        <p class="text-muted">Already have an account? <a href="/pages/guest/login/" style="color:var(--accent);font-weight:600">Sign in</a></p>
      </div>
      <form onsubmit="handleRegister(event)">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-bold">First Name</label><input type="text" class="form-control" placeholder="Juan" required /></div>
          <div class="col-md-6"><label class="form-label fw-bold">Last Name</label><input type="text" class="form-control" placeholder="Dela Cruz" required /></div>
          <div class="col-12">
            <label class="form-label fw-bold">Email Address</label>
            <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" placeholder="juan@email.com" required /></div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Mobile Number</label>
            <div class="input-group"><span class="input-group-text">+63</span><input type="tel" class="form-control" placeholder="9XX XXX XXXX" required /></div>
          </div>
          <div class="col-md-6"><label class="form-label fw-bold">Date of Birth</label><input type="date" class="form-control" /></div>
          <div class="col-12">
            <label class="form-label fw-bold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="regPassword" placeholder="Create a strong password" oninput="checkStrength(this.value)" required />
              <button type="button" class="input-group-text" onclick="togglePwd('regPassword',this)"><i class="bi bi-eye"></i></button>
            </div>
            <div class="mt-2">
              <div class="strength-bar" id="strengthBar" style="background:#dee2e6;width:100%"></div>
              <small id="strengthText" class="text-muted"></small>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="confirmPwd" placeholder="Repeat password" required />
              <button type="button" class="input-group-text" onclick="togglePwd('confirmPwd',this)"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <div class="col-12"><label class="form-label fw-bold">Delivery Address</label><textarea class="form-control" rows="2" placeholder="House No., Street, Barangay, City, Province"></textarea></div>
          <div class="col-12">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms" style="font-size:0.88rem">I agree to the <a href="#" style="color:var(--accent)">Terms of Service</a> and <a href="#" style="color:var(--accent)">Privacy Policy</a></label></div>
          </div>
          <div class="col-12">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="newsletter" checked><label class="form-check-label" for="newsletter" style="font-size:0.88rem">Receive exclusive deals and promotions via email</label></div>
          </div>
          <div class="col-12"><button type="submit" class="btn-navy btn w-100 py-2"><i class="bi bi-person-check me-2"></i>Create Account</button></div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
function handleRegister(e) {
  e.preventDefault();
  const pwd = document.getElementById('regPassword').value;
  const confirm = document.getElementById('confirmPwd').value;
  if (pwd !== confirm) { showToast('Passwords do not match.', 'error'); return; }
  Auth.login({ id: 2, name: 'New Customer', email: 'new@demo.com', role: 'customer' });
  showToast('Account created successfully! Welcome to ShopEase! 🎉', 'success');
  setTimeout(() => window.location.href = '/pages/customer/dashboard/', 1200);
}

function checkStrength(pwd) {
  const bar = document.getElementById('strengthBar'), text = document.getElementById('strengthText');
  let score = 0;
  if (pwd.length >= 8) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  const levels = [{w:'25%',bg:'#dc3545',label:'Weak'},{w:'50%',bg:'#ffc107',label:'Fair'},{w:'75%',bg:'#17a2b8',label:'Good'},{w:'100%',bg:'#28a745',label:'Strong'}];
  const l = levels[Math.max(0,score-1)];
  bar.style.width = l.w; bar.style.background = l.bg;
  text.textContent = pwd.length ? 'Password strength: ' + l.label : '';
  text.style.color = l.bg;
}

function togglePwd(id, btn) {
  const input = document.getElementById(id), icon = btn.querySelector('i');
  if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; icon.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
