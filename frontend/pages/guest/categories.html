<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b55" />
  <title>Categories - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg main-navbar">
  <div class="container-fluid px-3 px-md-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="d-flex d-lg-none align-items-center gap-1 ms-auto me-2">
      <a href="/pages/customer/cart/" class="navbar-cart-btn"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="bi bi-list"></i></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/catalog/">Shop</a></li>
        <li class="nav-item"><a class="nav-link active" href="/pages/guest/categories/">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/about/">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/contact/">Contact</a></li>
      </ul>
      <a href="/pages/customer/cart/" class="navbar-cart-btn me-2 d-none d-lg-inline-flex"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
      <a href="/pages/guest/login/" class="btn btn-outline-light btn-sm nav-login-link mt-2 mt-lg-0"><i class="bi bi-person me-1"></i>Sign In</a>
    </div>
  </div>
</nav>

<nav class="mobile-bottom-nav d-flex d-lg-none">
  <a href="/" data-page="index"><i class="bi bi-house-fill"></i>Home</a>
  <a href="/pages/guest/catalog/" data-page="catalog"><i class="bi bi-shop"></i>Shop</a>
  <a href="/pages/guest/categories/" data-page="categories" class="active"><i class="bi bi-grid-3x3-gap"></i>Categories</a>
  <a href="/pages/customer/cart/" data-page="cart"><i class="bi bi-cart3"></i>Cart<span class="mob-cart-badge" style="display:none">0</span></a>
  <a href="/pages/guest/login/" data-page="login" class="nav-login-link"><i class="bi bi-person"></i>Account</a>
</nav>

<div class="page-header">
  <div class="container-fluid px-3 px-md-4">
    <h1>All Categories</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/">Home</a></li><li class="breadcrumb-item active">Categories</li></ol></nav>
  </div>
</div>

<section class="section">
  <div class="container-fluid px-3 px-md-4">
    <div class="row g-3" id="allCategoriesGrid"></div>
  </div>
</section>

<footer class="main-footer"><div class="footer-bottom"><div class="container-fluid px-3 text-center"><span>&copy; 2026 ShopEase.</span></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/responsive.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('allCategoriesGrid').innerHTML = SAMPLE_CATEGORIES.map(cat => `
    <div class="col-6 col-sm-4 col-md-3 col-lg-3">
      <a href="/pages/guest/catalog/?cat=${encodeURIComponent(cat.name)}" class="text-decoration-none">
        <div class="category-card h-100">
          <div class="category-icon" style="background:${cat.color}">${cat.icon}</div>
          <div class="category-name">${cat.name}</div>
          <div class="category-count">${cat.count} products</div>
          <div class="mt-2"><span class="btn btn-sm btn-outline-navy">Browse <i class="bi bi-arrow-right ms-1"></i></span></div>
        </div>
      </a>
    </div>`).join('');
});
</script>
</body>
</html>
