<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2b55" />
  <title>Shop - ShopEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg main-navbar">
  <div class="container-fluid px-3 px-md-4">
    <a class="navbar-brand" href="/"><i class="bi bi-bag-heart-fill me-1"></i>Shop<span>Ease</span></a>
    <div class="d-flex d-lg-none align-items-center gap-1 ms-auto me-2">
      <a href="/pages/customer/cart/" class="navbar-cart-btn"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
    </div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><i class="bi bi-list"></i></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="/pages/guest/catalog/">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/categories/">Categories</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/about/">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/guest/contact/">Contact</a></li>
      </ul>
      <form class="navbar-search-form mx-lg-3 my-2 my-lg-0" onsubmit="event.preventDefault(); performSearch(this.querySelector('input').value)">
        <input type="text" placeholder="Search products..." /><button type="submit"><i class="bi bi-search"></i></button>
      </form>
      <a href="/pages/customer/cart/" class="navbar-cart-btn me-2 d-none d-lg-inline-flex"><i class="bi bi-cart3"></i><span class="cart-badge" style="display:none">0</span></a>
      <a href="/pages/guest/login/" class="btn btn-outline-light btn-sm nav-login-link mt-2 mt-lg-0"><i class="bi bi-person me-1"></i>Sign In</a>
      <div class="dropdown nav-user-menu mt-2 mt-lg-0" style="display:none">
        <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle me-1"></i><span class="nav-user-name">Account</span></button>
        <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
          <li><a class="dropdown-item" href="/pages/customer/dashboard/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
          <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-bottom-nav d-flex d-lg-none">
  <a href="/" data-page="index"><i class="bi bi-house-fill"></i>Home</a>
  <a href="/pages/guest/catalog/" data-page="catalog" class="active"><i class="bi bi-shop"></i>Shop</a>
  <a href="/pages/guest/search/" data-page="search"><i class="bi bi-search"></i>Search</a>
  <a href="/pages/customer/cart/" data-page="cart"><i class="bi bi-cart3"></i>Cart<span class="mob-cart-badge" style="display:none">0</span></a>
  <a href="/pages/guest/login/" data-page="login" class="nav-login-link"><i class="bi bi-person"></i>Account</a>
  <a href="/pages/customer/dashboard/" data-page="dashboard" class="nav-user-menu" style="display:none"><i class="bi bi-person-check"></i>Account</a>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container-fluid px-3 px-md-4">
    <h1 id="pageTitle">All Products</h1>
    <nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/">Home</a></li><li class="breadcrumb-item active">Shop</li></ol></nav>
  </div>
</div>

<!-- FILTER OFFCANVAS (mobile) -->
<div class="filter-offcanvas-backdrop"></div>
<div class="filter-offcanvas" id="filterOffcanvas">
  <div class="filter-title">
    <span><i class="bi bi-funnel me-2"></i>Filters</span>
    <button id="filterCloseBtn" class="btn btn-sm btn-outline-secondary py-0 px-2"><i class="bi bi-x-lg"></i></button>
  </div>
  <div id="filterContentMobile"></div>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-navy flex-fill" onclick="applyFilters(); document.querySelector('.filter-offcanvas').classList.remove('show'); document.querySelector('.filter-offcanvas-backdrop').classList.remove('show'); document.body.style.overflow=''">Apply Filters</button>
    <button class="btn btn-outline-secondary" onclick="resetFilters()"><i class="bi bi-x-circle"></i></button>
  </div>
</div>

<div class="container-fluid px-3 px-md-4 py-3">

  <!-- Mobile toolbar: filter btn + sort -->
  <div class="d-flex d-lg-none justify-content-between align-items-center mb-3 gap-2">
    <button id="filterOpenBtn" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-funnel me-1"></i>Filters
    </button>
    <div class="d-flex gap-2 align-items-center flex-fill justify-content-end">
      <select class="form-select form-select-sm" style="max-width:165px" onchange="sortProducts(this.value)">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price &#8593;</option>
        <option value="price-desc">Price &#8595;</option>
        <option value="rating">Top Rated</option>
        <option value="name">A&ndash;Z</option>
      </select>
      <div class="btn-group">
        <button class="btn btn-sm btn-navy" onclick="setView('grid',this)"><i class="bi bi-grid-3x3-gap"></i></button>
        <button class="btn btn-sm btn-outline-secondary" onclick="setView('list',this)"><i class="bi bi-list-ul"></i></button>
      </div>
    </div>
  </div>

  <div class="row g-3 g-md-4">
    <!-- DESKTOP SIDEBAR -->
    <div class="col-lg-3 col-xl-2 d-none d-lg-block">
      <div class="filter-sidebar" style="position:sticky;top:70px">
        <div class="filter-title"><i class="bi bi-funnel me-2"></i>Filters</div>
        <div id="filterContentDesktop"></div>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" onclick="resetFilters()"><i class="bi bi-x-circle me-1"></i>Reset</button>
      </div>
    </div>

    <!-- PRODUCTS AREA -->
    <div class="col-12 col-lg-9 col-xl-10">
      <!-- Desktop toolbar -->
      <div class="d-none d-lg-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div id="resultCount" class="text-muted" style="font-size:0.88rem"></div>
        <div class="d-flex gap-2 align-items-center">
          <span class="text-muted" style="font-size:0.82rem">Sort:</span>
          <select class="form-select form-select-sm" style="width:auto" onchange="sortProducts(this.value)">
            <option value="default">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="name">Name A&ndash;Z</option>
          </select>
          <div class="btn-group">
            <button class="btn btn-sm btn-navy" onclick="setView('grid',this)"><i class="bi bi-grid-3x3-gap"></i></button>
            <button class="btn btn-sm btn-outline-secondary" onclick="setView('list',this)"><i class="bi bi-list-ul"></i></button>
          </div>
        </div>
      </div>
      <!-- Mobile result count -->
      <div id="resultCountMob" class="d-lg-none text-muted mb-2" style="font-size:0.82rem"></div>

      <div class="row g-2 g-md-3" id="catalogGrid"></div>

      <nav class="mt-4 d-flex justify-content-center">
        <ul class="pagination pagination-sm">
          <li class="page-item disabled"><a class="page-link" href="#">&laquo;</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item"><a class="page-link" href="#">&raquo;</a></li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<footer class="main-footer mt-4"><div class="footer-bottom"><div class="container-fluid px-3 px-md-4 text-center"><span>&copy; 2026 ShopEase.</span></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/responsive.js"></script>
<script>
let currentProducts = [...SAMPLE_PRODUCTS];
let currentView = 'grid';

// Build filter HTML (shared for desktop sidebar + mobile offcanvas)
function buildFilterHTML() {
  const cats = [...new Set(SAMPLE_PRODUCTS.map(p => p.category))];
  const params = new URLSearchParams(window.location.search);
  const activeCat = params.get('cat') || '';
  return `
    <div class="filter-group">
      <div class="filter-group-title">Categories</div>
      <div class="filter-check">
        ${cats.map(c => `
          <div class="form-check">
            <input class="form-check-input cat-filter" type="checkbox" id="cat-${c}" value="${c}" ${activeCat===c?'checked':''} onchange="applyFilters()">
            <label class="form-check-label" for="cat-${c}">${c}</label>
          </div>`).join('')}
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Price Range</div>
      <div class="price-range mb-2">
        <input type="number" class="minPrice" placeholder="Min &#8369;" />
        <input type="number" class="maxPrice" placeholder="Max &#8369;" />
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Availability</div>
      <div class="filter-check">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="inStock" checked><label class="form-check-label" for="inStock">In Stock</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="onSale"><label class="form-check-label" for="onSale">On Sale</label></div>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  const cat = params.get('cat');
  if (cat) document.getElementById('pageTitle').textContent = cat;

  const html = buildFilterHTML();
  document.getElementById('filterContentDesktop').innerHTML = html;
  document.getElementById('filterContentMobile').innerHTML  = html;

  if (cat) applyFilters();
  else renderCatalog();
});

function applyFilters() {
  const checked = [...document.querySelectorAll('.cat-filter:checked')].map(i => i.value);
  const minPEl  = document.querySelector('#filterContentDesktop .minPrice') || document.querySelector('.minPrice');
  const maxPEl  = document.querySelector('#filterContentDesktop .maxPrice') || document.querySelector('.maxPrice');
  const minP = parseFloat(minPEl?.value) || 0;
  const maxP = parseFloat(maxPEl?.value) || Infinity;
  currentProducts = SAMPLE_PRODUCTS.filter(p => {
    const catOk = checked.length === 0 || checked.includes(p.category);
    return catOk && p.price >= minP && p.price <= maxP;
  });
  renderCatalog();
}

function resetFilters() {
  document.querySelectorAll('.cat-filter').forEach(i => i.checked = false);
  document.querySelectorAll('.minPrice,.maxPrice').forEach(i => i.value = '');
  currentProducts = [...SAMPLE_PRODUCTS];
  renderCatalog();
}

function sortProducts(val) {
  const p = [...currentProducts];
  if (val==='price-asc')  p.sort((a,b) => a.price - b.price);
  else if (val==='price-desc') p.sort((a,b) => b.price - a.price);
  else if (val==='rating') p.sort((a,b) => b.rating - a.rating);
  else if (val==='name')   p.sort((a,b) => a.name.localeCompare(b.name));
  currentProducts = p;
  renderCatalog();
}

function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.btn-group .btn').forEach(b => { b.classList.remove('btn-navy'); b.classList.add('btn-outline-secondary'); });
  btn.classList.add('btn-navy'); btn.classList.remove('btn-outline-secondary');
  renderCatalog();
}

function renderCatalog() {
  const grid = document.getElementById('catalogGrid');
  const msg  = `Showing ${currentProducts.length} product${currentProducts.length!==1?'s':''}`;
  const rc   = document.getElementById('resultCount');
  const rcm  = document.getElementById('resultCountMob');
  if (rc)  rc.textContent  = msg;
  if (rcm) rcm.textContent = msg;

  if (!currentProducts.length) {
    grid.innerHTML = `<div class="col-12 text-center py-5"><i class="bi bi-search" style="font-size:3rem;color:#dee2e6"></i><p class="mt-3 text-muted">No products found. Try adjusting your filters.</p></div>`;
    return;
  }

  if (currentView === 'grid') {
    grid.innerHTML = currentProducts.map(p => `
      <div class="col-6 col-md-4 col-xl-3">
        <div class="product-card h-100">
          <div class="product-card-img">
            ${p.badge?`<span class="product-badge badge-${p.badge}">${p.badge.toUpperCase()}</span>`:''}
            <span style="font-size:3rem">${p.image}</span>
          </div>
          <div class="product-card-body">
            <div class="product-card-category">${p.category}</div>
            <div class="product-card-title">${p.name}</div>
            <div class="product-stars">${renderStars(p.rating)}<span>(${p.reviews})</span></div>
            <div class="product-price">${formatPrice(p.price)}${p.oldPrice?`<span class="product-price-old">${formatPrice(p.oldPrice)}</span>`:''}</div>
          </div>
          <div class="product-card-footer">
            <button class="btn btn-sm btn-navy flex-fill" onclick="Cart.add(${p.id})"><i class="bi bi-cart-plus me-1"></i>Add</button>
            <a href="/pages/guest/product-detail/?id=${p.id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
          </div>
        </div>
      </div>`).join('');
  } else {
    grid.innerHTML = '<div class="col-12">' + currentProducts.map(p => `
      <div class="d-flex align-items-center gap-3 p-2 p-md-3 border rounded mb-2 bg-white">
        <div style="width:75px;height:75px;min-width:75px;background:#f8f9fa;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2rem">${p.image}</div>
        <div class="flex-fill min-width-0">
          <div style="font-size:0.72rem;color:#1a6fc4;font-weight:600">${p.category}</div>
          <div style="font-weight:700;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div class="product-stars" style="font-size:0.78rem">${renderStars(p.rating)}</div>
        </div>
        <div class="text-end flex-shrink-0">
          <div class="product-price" style="font-size:1rem">${formatPrice(p.price)}</div>
          <button class="btn btn-sm btn-navy mt-1" onclick="Cart.add(${p.id})"><i class="bi bi-cart-plus"></i></button>
          <a href="/pages/guest/product-detail/?id=${p.id}" class="btn btn-sm btn-outline-secondary mt-1"><i class="bi bi-eye"></i></a>
        </div>
      </div>`).join('') + '</div>';
  }
}
</script>
</body>
</html>
